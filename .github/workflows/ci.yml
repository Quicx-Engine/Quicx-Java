name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit tests, Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [11, 17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -f quicx-java/pom.xml test

  quicxd:
    name: against a real quicxd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anastassow/Quicx
          path: quicx
      - name: build quicxd
        run: make -C quicx quicxd && quicx/quicxd version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: QUICXD="$PWD/quicx/quicxd" mvn -B -f quicx-java/pom.xml test
