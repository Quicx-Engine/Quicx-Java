plugins {
    id 'java-library'
    id 'maven-publish'
}

group   = 'dev.quicx'
version = '2.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 11
}

repositories {
    mavenCentral()
}

dependencies {
    // the library itself has no dependencies; JUnit is for the tests only
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes('Automatic-Module-Name': 'dev.quicx.client')
    }
}

javadoc {
    exclude 'dev/quicx/internal/**'
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
