plugins {
    id 'java-library'
    id 'maven-publish'
}

group   = 'dev.quicx'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // no external dependencies — pure Java
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}